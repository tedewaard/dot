theme = "catppuccin_mocha"

[editor]
line-number = "relative"
rulers = [80]
true-color = true
scrolloff = 5
#cursorcolumn = true
cursorline = true
bufferline = "always"
trim-trailing-whitespace = true

[editor.file-picker]
hidden = false

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.inline-diagnostics]
cursor-line = "info"
other-lines = "warning"

[editor.statusline]
left = ["mode"]
center = ["file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "total-line-numbers", "version-control", "file-type", "spinner" ]
mode.normal = "NORMAL"
mode.select = "SELECT"
mode.insert = "INSERT"
